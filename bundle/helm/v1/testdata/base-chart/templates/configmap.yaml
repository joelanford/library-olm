apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-parent
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/name: base-chart
data:
  defaultOnly: {{ .Values.parent.defaultOnly | quote }}
  overridden: {{ .Values.parent.overridden | quote }}
  required: {{ required "parent.requiredValue is required" .Values.parent.requiredValue | quote }}
  global: {{ .Values.global.shared | quote }}
  releaseName: {{ .Release.Name | quote }}
  releaseNamespace: {{ .Release.Namespace | quote }}
  releaseService: {{ .Release.Service | quote }}
  isInstall: {{ .Release.IsInstall | quote }}
  isUpgrade: {{ .Release.IsUpgrade | quote }}
  revision: {{ .Release.Revision | quote }}
  chartName: {{ .Chart.Name | quote }}
  chartVersion: {{ .Chart.Version | quote }}
  appVersion: {{ .Chart.AppVersion | quote }}
  templateName: {{ .Template.Name | quote }}
  templateBasePath: {{ .Template.BasePath | quote }}
  file: {{ .Files.Get "files/message.txt" | trim | quote }}
  included: {{ include "base-chart.label" . | quote }}
  library: {{ include "library.label" . | quote }}
  templated: {{ template "base-chart.template" . | quote }}
  kubeVersion: {{ .Capabilities.KubeVersion.Version | quote }}
  kubeMajor: {{ .Capabilities.KubeVersion.Major | quote }}
  kubeMinor: {{ .Capabilities.KubeVersion.Minor | quote }}
  hasV1: {{ .Capabilities.APIVersions.Has "v1" | quote }}
  hasDeployment: {{ .Capabilities.APIVersions.Has "apps/v1/Deployment" | quote }}
