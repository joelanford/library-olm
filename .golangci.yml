version: "2"

formatters:
  enable:
    - gci
    - gofmt

linters:
  enable:
    - errcheck
    - gomodguard
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/joelanford/library-olm)

  gomodguard:
    blocked:
      modules:
        - github.com/operator-framework/api:
            reason: "legacy dependency — use minimally, prefer local types (see specs/mission.md)"
        - github.com/operator-framework/operator-registry:
            reason: "legacy dependency — use minimally (see specs/mission.md)"
